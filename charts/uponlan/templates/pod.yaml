{{- if eq .Values.deployAs "Pod" }}
# Pod kind on purpose for `podman play kube`: a Deployment is flattened to a
# pod and renamed (`uponlan` -> `uponlan-pod`), which breaks `--replace`/`--down`
# lifecycle matching. Keep a Pod here so podman manages it by the stable name
# `uponlan`. For a real K8s cluster, set `deployAs: Deployment` (deployment.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: uponlan
  labels:
    app.kubernetes.io/name: uponlan
spec:
  {{- include "uponlan.podspec" . | nindent 2 }}
{{- end }}
