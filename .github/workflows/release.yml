name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Menu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get menu version
        id: version
        run: echo "tag=$(sed -n 's/^set menu_version //p' release/menus/version.ipxe)" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git tag --list "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "ERROR: git tag ${{ steps.version.outputs.tag }} already exists" >&2
            exit 1
          fi

      # Menu release only: pack the menu scripts (menus.tar.gz). The iPXE ROMs
      # are NOT built here — they must embed the deployment's TLS cert, so they
      # are built at deploy time (init.sh, or the webapp Build UI). Asset
      # bundles are released independently by assets.yml; the menu just *points*
      # at them.
      - name: Build Menu release
        run: ./scripts/release_menu.sh "${{ steps.version.outputs.tag }}"

      - name: Extract release notes
        id: notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Create release and upload menu
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/output/menu/${{ steps.version.outputs.tag }}/menus.tar.gz
          file_glob: false
          overwrite: true
          prerelease: false
          release_name: ${{ steps.version.outputs.tag }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.release_notes }}