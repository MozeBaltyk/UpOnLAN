---
# Fresh-host provisioning for the UpOnLAN PXE workflow:
# installs the host packages needed to build the custom iPXE ROMs and run
# BIOS/UEFI PXE guests, then builds + installs + verifies the ROM artifacts.
#
#   ansible-playbook ansible/release_ipxe.yml
#
# Afterwards: ./scripts/build_release.sh <version>  (or release_menu.sh)
#             ./wakemeup.sh -a deploy
- hosts: localhost
  connection: local
  become: true
  roles:
    - release_ipxe