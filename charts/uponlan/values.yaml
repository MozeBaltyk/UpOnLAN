## Render target. `Pod` (default) keeps `podman play kube --replace`/`--down`
## working by the stable `uponlan` name; `Deployment` is for a real K8s cluster
## (adds replicas/selector, drops hostPort + the podman emptyDir.path extension).
deployAs: Pod

## Replica count — Deployment mode only.
replicas: 1

## Image. Defaults to the published ghcr image; for local development set:
##   image.repository=localhost/uponlan  and  image.pullPolicy=Never
image:
  repository: ghcr.io/mozebaltyk/uponlan
  tag: latest
  pullPolicy: IfNotPresent

## Menu/asset origin. Defaults to GitHub; deploy --local sets the local mirror.
endpoint: https://github.com/mozebaltyk/uponlan

## Menu version. Empty on GitHub means init.sh resolves releases/latest. The
## local mirror has no "latest" tarball (menu/latest is a JSON file), so a
## specific version is required there.
menuVersion: ""

## Bound host ports. 69/udp (TFTP) is privileged. webAppPort is NOT published
## — the webapp is reachable only through the nginx TLS proxy on webAppHttpsPort.
nginxPort: 8080
webAppPort: 3000
tftpdOpts: "--tftp-single-port"

## HTTPS termination. nginx serves assets on httpsPort and reverse-proxies the
## webapp on webAppHttpsPort over TLS. A mounted cert+key at /config/tls/
## (server.crt + server.key) is used when present; otherwise init.sh generates
## a self-signed fallback. Plain HTTP 8080 stays available for iPXE boot
## clients; the webapp is reachable only through the TLS proxy (no plain-HTTP
## hostPort).
httpsPort: 8443
webAppHttpsPort: 3443

## Host libvirt socket mount. Node-local: the webapp's VM console shells out to
## `virsh` on the same host's qemu:///system. Disable on a real K8s cluster.
libvirt:
  enabled: true
  socketPath: /var/run/libvirt/libvirt-sock
