# Basic automated Rocky Linux install (example profile).
# Served by release/menus/rockylinux.ipxe via inst.ks=.
#
# CHANGE-ME: regenerate the user password hash with:
#   openssl passwd -6 '<password>'
# (the hash below is for the plaintext password "uponlan").

lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Wipe the first disk and auto-partition it.
zerombr
clearpart --all --initlabel
autopart

network --bootproto=dhcp --device=link --activate
firewall --enabled --service=ssh

# Lock root; log in as "uponlan" (password "uponlan").
rootpw --lock
user --name=uponlan --groups=wheel --iscrypted --password=$6$kFYTpR8J21A9qzH5$YpZ2UilRmdwlepcXb3rh0sm4Lml.RBsbHhyW4bWCSaFFm9RSJzG3U2MDLNI7ko6tY6L8lHfWB2K6Ux2BHo2Zk.

%packages
@^minimal-environment
%end

reboot
