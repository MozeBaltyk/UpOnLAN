name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Menu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version
        id: version
        run: echo "tag=$(jq -r '.version' src/webapp/package.json)" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        run: |
          if git tag --list "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "ERROR: git tag ${{ steps.version.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Install iPXE build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils liblzma-dev xz-utils curl

      # Menu release only: build the iPXE ROMs (baked into menus.tar.gz by
      # release_menu.sh) then pack the menus. Asset bundles are released
      # independently by assets.yml; the menu just *points* at them.
      - name: Build iPXE ROMs
        run: ./scripts/build_ipxe_roms.sh

      - name: Build Menu release
        run: ./scripts/release_menu.sh "${{ steps.version.outputs.tag }}"

      - name: Extract release notes
        id: notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Create release and upload menu
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/output/menu/${{ steps.version.outputs.tag }}/menus.tar.gz
          file_glob: false
          overwrite: true
          prerelease: false
          release_name: ${{ steps.version.outputs.tag }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.release_notes }}